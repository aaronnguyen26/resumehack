<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Owl Body Gradient -->
    <linearGradient id="owlBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Chest Gradient -->
    <linearGradient id="chestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Tassel Emerald Gradient -->
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Beak Amber Gradient -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Ambient Light Behind Mascot -->
  <circle cx="256" cy="270" r="160" fill="#4f46e5" opacity="0.35" filter="url(#glow)" />

  <!-- Group: Hacky Character -->
  <g transform="translate(0, 10)">
    <!-- Owl Ears / Head Base Shape -->
    <path d="M 160 170 L 190 220 L 322 220 L 352 170 L 372 260 C 372 360 320 420 256 420 C 192 420 140 360 140 260 Z" fill="url(#owlBodyGrad)" />

    <!-- Wings (Left & Right) -->
    <path d="M 140 260 C 120 310 140 370 175 400 C 150 360 145 310 155 260 Z" fill="#3730a3" />
    <path d="M 372 260 C 392 310 372 370 337 400 C 362 360 367 310 357 260 Z" fill="#3730a3" />

    <!-- Chest Plumes -->
    <path d="M 200 300 C 200 380 230 410 256 410 C 282 410 312 380 312 300 C 312 280 200 280 200 300 Z" fill="url(#chestGrad)" />

    <!-- Feet Claws -->
    <path d="M 215 415 C 215 432 205 436 198 436 C 208 436 215 425 225 436 C 232 436 226 420 225 415 Z" fill="url(#beakGrad)" />
    <path d="M 297 415 C 297 432 307 436 314 436 C 304 436 297 425 287 436 C 280 436 286 420 287 415 Z" fill="url(#beakGrad)" />

    <!-- Eye Rings / Glasses Frames -->
    <!-- Left Glass -->
    <circle cx="206" cy="272" r="48" fill="#ffffff" stroke="#1e1b4b" stroke-width="10" />
    <!-- Right Glass -->
    <circle cx="306" cy="272" r="48" fill="#ffffff" stroke="#1e1b4b" stroke-width="10" />
    <!-- Glasses Bridge -->
    <path d="M 250 268 Q 256 260 262 268" fill="none" stroke="#1e1b4b" stroke-width="10" stroke-linecap="round" />

    <!-- Pupils -->
    <circle cx="214" cy="272" r="24" fill="#0f172a" />
    <circle cx="298" cy="272" r="24" fill="#0f172a" />

    <!-- Eye Catchlights -->
    <circle cx="206" cy="264" r="8" fill="#ffffff" />
    <circle cx="222" cy="280" r="4" fill="#ffffff" />
    <circle cx="290" cy="264" r="8" fill="#ffffff" />
    <circle cx="306" cy="280" r="4" fill="#ffffff" />

    <!-- Triangular Beak -->
    <polygon points="256,284 242,314 270,314" fill="url(#beakGrad)" stroke="#b45309" stroke-width="2" stroke-linejoin="round" />

    <!-- Graduation Cap (Mortarboard) -->
    <!-- Cap Skull Base -->
    <path d="M 216 160 C 216 148 296 148 296 160 L 286 182 L 226 182 Z" fill="#0f172a" />

    <!-- Cap Diamond Top -->
    <polygon points="256,110 376,148 256,186 136,148" fill="#1e293b" stroke="#334155" stroke-width="4" stroke-linejoin="round" />
    <!-- Cap Rim Highlight -->
    <polygon points="256,114 366,148 256,180 146,148" fill="#0f172a" />

    <!-- Cap Button / Center Stud -->
    <circle cx="256" cy="148" r="8" fill="#10b981" />

    <!-- Emerald Tassel String & Drape -->
    <path d="M 256 148 Q 330 150 348 190 Q 354 215 350 240" fill="none" stroke="url(#tasselGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Tassel Fringe Bobble -->
    <rect x="342" y="236" width="16" height="26" rx="6" fill="url(#tasselGrad)" />
    <circle cx="350" cy="236" r="6" fill="#34d399" />
  </g>
</svg>
